<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seera - ATS CV and cover letter builder | سيرة</title>
<meta name="description" content="Free ATS-friendly CV and cover letter builder in Arabic and English. PDF export, no account, data stays on your device.">
<meta name="theme-color" content="#1d2433">
<meta property="og:title" content="Seera - ATS CV and cover letter builder"><meta property="og:description" content="Free, Arabic and English, PDF export, no account.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="logo.svg" alt="" width="34" height="34"><div><b id="brandName">Seera</b><small id="brandTag"></small></div></div>
  <div class="top-actions">
    <button class="btn ghost" id="btnDocs" type="button"></button>
    <button class="btn ghost" id="btnUi" type="button" aria-label="Language"></button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main class="layout" id="layout" data-tab="edit">
  <section class="pane editor" id="paneEdit" aria-label="Editor"></section>
  <section class="pane preview" id="panePreview" aria-label="Preview">
    <div class="pv-bar" id="pvBar"></div>
    <div class="sheet-wrap"><div id="sheet" class="sheet"></div></div>
  </section>
  <section class="pane check" id="paneCheck" aria-label="ATS check"></section>
</main>
<dialog id="dlgDocs" aria-label="Documents"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<script src="core.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
